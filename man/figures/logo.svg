<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">ivreg2r logo</title>
  <desc id="desc">Clean vector logo with hexagonal badge, darker right-shaded lute icon, and ivreg2r wordmark.</desc>
  <defs>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8ee"/>
      <stop offset="1" stop-color="#f1ecdf"/>
    </linearGradient>
    <linearGradient id="luteFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc94c"/>
      <stop offset="0.50" stop-color="#f79a24"/>
      <stop offset="1" stop-color="#dc5f22"/>
    </linearGradient>
    <linearGradient id="luteRightShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f351f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#6f2b18" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5f2315" stop-opacity="0.36"/>
    </linearGradient>
    <clipPath id="luteColorClip">
      <path d="M381 324
               C337 356 314 408 314 459
               C314 517 348 548 400 549
               C452 548 486 517 486 459
               C486 408 463 356 419 324
               L411 202
               L389 202 Z"/>
      <path d="M390 202 L400 145 L410 202 Z"/>
    </clipPath>
    <style>
      .ink { fill:#222b35; }
      .stroke { stroke:#222b35; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- transparent page background intentionally omitted for web use -->
  <g id="badge">
    <polygon points="400,38 720,223 720,577 400,762 80,577 80,223"
             fill="url(#badgeFill)" stroke="#f7f1e6" stroke-width="36" stroke-linejoin="round"/>
    <polygon points="400,58 698,231 698,569 400,742 102,569 102,231"
             fill="none" stroke="#222b35" stroke-width="25" stroke-linejoin="round"/>
  </g>

  <g id="lute" class="stroke">
    <!-- body -->
    <path d="M381 324
             C337 356 314 408 314 459
             C314 517 348 548 400 549
             C452 548 486 517 486 459
             C486 408 463 356 419 324
             L411 202
             L389 202 Z"
          fill="url(#luteFill)" stroke-width="13"/>
    <!-- neck highlight/center seam -->
    <path d="M400 202 L400 545" fill="none" stroke="#9f4f2a" stroke-width="3" opacity="0.5"/>
    <!-- headstock -->
    <path d="M390 202 L400 145 L410 202 Z" fill="url(#luteFill)" stroke-width="13"/>
    <!-- subtle darker right side of the lute body, matching the source image -->
    <g clip-path="url(#luteColorClip)">
      <rect x="400" y="140" width="92" height="415" fill="url(#luteRightShade)"/>
    </g>
    <path d="M390 145 H410" fill="none" stroke-width="13"/>
    <!-- tuning pegs -->
    <path d="M386 165 H368 M414 165 H432 M386 184 H362 M414 184 H438 M386 203 H368 M414 203 H432"
          fill="none" stroke-width="10"/>
    <!-- sound hole and bridge -->
    <circle cx="400" cy="430" r="25" fill="none" stroke-width="13"/>
    <path d="M366 500 H434" fill="none" stroke-width="13"/>
  </g>

