# Public-repo CI. This file lives at pkg/.github/ in the private
# development repo (fditraglia/ivreg2r), where GitHub ignores it (only the
# repo-root .github/ is executed). After `git subtree push --prefix=pkg`,
# pkg/ becomes the root of the public repo (restatr/ivreg2r), so this
# workflow runs there — on exactly the tree users install. Keep it in sync
# with the private repo's root workflow, minus the working-directory
# settings (here the package IS the repo root).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # Ubuntu and Windows jobs are non-blocking (2026-06-11): all fail on the known optimizer-basin-sensitive card CUE cells in test-cue.R (macOS happens to land in Stata's basin), slated for deletion at the M-17 fixture re-base. Remove `nonblocking` everywhere once that lands.
    continue-on-error: ${{ matrix.config.nonblocking == true }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', nonblocking: true}
          - {os: ubuntu-latest, r: 'oldrel-1', nonblocking: true}
          - {os: macos-latest,  r: 'release'}
          - {os: macos-latest,  r: 'oldrel-1'}
          - {os: windows-latest, r: 'release', nonblocking: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
