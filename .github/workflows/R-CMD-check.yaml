# Public-repo CI. This file lives at pkg/.github/ in the private
# development repo (fditraglia/ivreg2r), where GitHub ignores it (only the
# repo-root .github/ is executed). After `git subtree push --prefix=pkg`,
# pkg/ becomes the root of the public repo (restatr/ivreg2r), so this
# workflow runs there — on exactly the tree users install. Keep it in sync
# with the private repo's root workflow, minus the working-directory
# settings (here the package IS the repo root).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # All five jobs are blocking (2026-07-11): the `nonblocking` safety margin
    # was scheduled for removal once the Tranche 3 fixture re-base completed,
    # and the CRAN-readiness audit (planning/29) flagged that the removal never
    # happened. A red job on any platform is a real signal.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest,  r: 'release'}
          - {os: macos-latest,  r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
